
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SHISHIR | Voxel Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #050505;
        font-family: 'Press Start 2P', cursive;
        user-select: none;
      }
      /* Custom scrollbar for pixel feel */
      ::-webkit-scrollbar {
        width: 12px;
      }
      ::-webkit-scrollbar-track {
        background: #111;
      }
      ::-webkit-scrollbar-thumb {
        background: #444;
        border: 2px solid #111;
      }
      .pixel-border {
        border: 4px solid;
        border-image-slice: 2;
        border-image-width: 2;
        border-color: #3d3d3d #1a1a1a #1a1a1a #3d3d3d;
      }
      .mc-button {
        background-color: #8b8b8b;
        border: 4px solid;
        border-top-color: #dbdbdb;
        border-left-color: #dbdbdb;
        border-bottom-color: #555555;
        border-right-color: #555555;
        transition: all 0.1s;
        cursor: pointer;
      }
      .mc-button:hover {
        background-color: #9b9b9b;
        transform: scale(1.05);
      }
      .mc-button:active {
        border-top-color: #555555;
        border-left-color: #555555;
        border-bottom-color: #dbdbdb;
        border-right-color: #dbdbdb;
        transform: translateY(2px);
      }
      .mc-panel {
        background-color: #c6c6c6;
        border: 6px solid;
        border-top-color: #ffffff;
        border-left-color: #ffffff;
        border-bottom-color: #555555;
        border-right-color: #555555;
        box-shadow: 10px 10px 0px rgba(0,0,0,0.8);
      }
      .mc-dark-panel {
        background-color: rgba(0, 0, 0, 0.85);
        border: 4px solid #373737;
        backdrop-filter: blur(4px);
      }
      .pixelated {
        image-rendering: pixelated;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "three": "https://esm.sh/three@^0.182.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.37.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@react-three/fiber": "https://esm.sh/@react-three/fiber@^9.5.0",
    "@react-three/drei": "https://esm.sh/@react-three/drei@^10.7.7"
  }
}
</script>
</head>

    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
